name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install pyinstaller pyperclip requests pystray pillow

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --clean --name AskHelper runtimebroker.py

      - uses: actions/upload-artifact@v4
        with:
          name: AskHelper
          path: dist/AskHelper.exe
